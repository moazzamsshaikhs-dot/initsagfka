<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing page</title>
    <!-- <link rel="stylesheet" href="./assets/css/style.css"> -->
     <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    border: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 62.5%;
}
header{
    height: 100vh;
    width: 100%; 
    background: linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),url('https://media.istockphoto.com/id/1188236181/photo/close-up-of-pensive-woman-looking-at-sunset-through-airplane-window.jpg?s=612x612&w=0&k=20&c=M-csZCqraQE98tQbW2ZTAJkVOjkFemIe7H6abzjzwtc=');
    background-repeat: no-repeat;
    background-position: center; 
    object-fit: cover;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: start;
    padding: 0 3rem;
}
header h1{
    color: aliceblue;
    font-size: 5rem;
}
header p{
    color: aliceblue;
    font-size: 2.5rem;
}


        </style>
</head>
<body>
    <header>
            <h1>Explore your<br> dream vacation</h1>
            <p>Lorem Ipsum is simply dummy text of printing<br>and typesetting industry. Lorem Ipsum has been the<br>industry's standard dummy text.</p>
    </header>
</body>
</html>
